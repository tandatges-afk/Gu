name: gu-vps
services:
  app:
    image: ${GU_IMAGE:?Set GU_IMAGE to a tested GHCR image}
    restart: unless-stopped
    env_file:
      - ./config/gu-runtime.env
    environment:
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NODE_ENV: production
    expose:
      - '3000'
    mem_limit: 2500m
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/v6/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 80s
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ['80:80', '443:443']
    environment:
      GU_DOMAIN: ${GU_DOMAIN:?Set GU_DOMAIN to your preview hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
volumes:
  caddy_data:
  caddy_config:
networks:
  internal:
