# Optional, for offline migration/staging. Never expose PostgreSQL on a public port.
name: gu-postgres-stage
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gu
      POSTGRES_USER: gu_migrator
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set a strong password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    shm_size: 128mb
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U gu_migrator -d gu']
      interval: 20s
      retries: 5
volumes:
  pg_data:
