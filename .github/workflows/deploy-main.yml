name: GU V5 main — Validate / Stage / Deploy VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy after checks (stage safe, prod requires cutover approval)'
        required: true
        type: choice
        default: stage
        options: [stage, prod]
permissions:
  contents: read
concurrency:
  group: gu-v5-main
  cancel-in-progress: false
jobs:
  validate:
    name: Validate GU 5.4.6 V5 source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate correct version, lockfile and infrastructure
        run: |
          set -euo pipefail
          test -s package-lock.json
          test -f src/lib/pg-firestore.ts
          test -f src/app/api/version/route.ts
          test -f scripts/check-staging-env.mjs
          node -e 'const p=require("./package.json"); if (!/^5\.4\.6-vps\.fast-rc\./.test(p.version)) process.exit(1)'
      - name: CI tests and build
        run: |
          npm ci --no-audit --no-fund
          npm run verify:imports
          npm run typecheck
          npm test
          npm run build
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
  stage:
    name: Deploy isolated staging :3301
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gu-v5-staging
    steps:
      - uses: actions/checkout@v4
      - name: SSH and release to staging
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GU_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GU_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          opts="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          printf '%s\n' "$GITHUB_SHA" > .gu-deploy-commit
          host=gu-deploy@103.176.25.226
          ssh $opts "$host" "mkdir -p /home/gu-deploy/v5-incoming/stage/$id"
          rsync -az --delete --exclude='.git/' --exclude='.github/' --exclude='.env*' --exclude='node_modules/' --exclude='.next/' \
            -e "ssh $opts" ./ "$host:/home/gu-deploy/v5-incoming/stage/$id/"
          ssh $opts "$host" "sudo -n /usr/local/sbin/gu-v5-release stage $id"
  production:
    name: Deploy production :3302 (only after approval)
    needs: validate
    if: vars.GU_V5_PRODUCTION_DEPLOY == 'enabled' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gu-v5-production
    steps:
      - uses: actions/checkout@v4
      - name: SSH and release to production
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GU_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GU_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          opts="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          printf '%s\n' "$GITHUB_SHA" > .gu-deploy-commit
          host=gu-deploy@103.176.25.226
          ssh $opts "$host" "mkdir -p /home/gu-deploy/v5-incoming/prod/$id"
          rsync -az --delete --exclude='.git/' --exclude='.github/' --exclude='.env*' --exclude='node_modules/' --exclude='.next/' \
            -e "ssh $opts" ./ "$host:/home/gu-deploy/v5-incoming/prod/$id/"
          ssh $opts "$host" "sudo -n /usr/local/sbin/gu-v5-release prod $id"
